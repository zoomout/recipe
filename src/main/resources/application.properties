spring.application.name=recipe

# --- Datasource (in-memory H2, schema managed by Flyway) ---
spring.datasource.url=jdbc:h2:mem:recipes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Contributor notifications (POSTed to the external notification API) ---
notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:9090}

# --- Resilience: retry concurrent recipe updates on optimistic-lock conflicts ---
resilience4j.retry.instances.optimistic-locking.max-attempts=5
resilience4j.retry.instances.optimistic-locking.wait-duration=50ms
resilience4j.retry.instances.optimistic-locking.enable-randomized-wait=true
resilience4j.retry.instances.optimistic-locking.randomized-wait-factor=0.5
resilience4j.retry.instances.optimistic-locking.retry-exceptions=org.springframework.dao.OptimisticLockingFailureException

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics

# --- OpenAPI: Swagger UI only in the dev profile; the contract itself is always served ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
