spring.application.name=recipe

# --- Docker Compose support (opt-in via the dev profile) ---
spring.docker.compose.enabled=false

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recipes}
spring.datasource.username=${DB_USERNAME:recipes}
spring.datasource.password=${DB_PASSWORD:recipes}

# --- JPA / Hibernate (schema is owned by Flyway) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# batch lazy collection loads (ingredients, contributors) instead of one select per recipe (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# batch JDBC writes: ingredient rows are inserted/updated in one round trip instead of one per row
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# pessimistic lock timeout
jakarta.persistence.lock.timeout=3000

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# --- Contributor notifications (published as Kafka events) ---
notification.topic=${NOTIFICATION_TOPIC:recipe-events}
notification.partitions=${NOTIFICATION_PARTITIONS:1}
notification.replicas=${NOTIFICATION_REPLICAS:1}

# --- Resilience: retry concurrent recipe updates on optimistic-lock conflicts ---
resilience4j.retry.instances.optimistic-locking.max-attempts=5
resilience4j.retry.instances.optimistic-locking.wait-duration=50ms
resilience4j.retry.instances.optimistic-locking.enable-randomized-wait=true
resilience4j.retry.instances.optimistic-locking.randomized-wait-factor=0.5
resilience4j.retry.instances.optimistic-locking.retry-exceptions=org.springframework.dao.OptimisticLockingFailureException

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=recipe-service
info.app.description=Recipes management service

# --- OpenAPI ---
# springdoc (Swagger UI + generated /v3/api-docs) is disabled by default and
# only enabled in the dev profile / local demo stack; the static contract at
# /openapi/recipe-api.yaml is always served
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

