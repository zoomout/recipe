# Local development profile: starting the application also starts the backing
# services (PostgreSQL + Kafka) as Docker containers via Spring Boot's Docker
# Compose support, so the API can be tested manually right away.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Connection details (JDBC url, Kafka bootstrap servers) are derived from the
# running containers automatically; the containers are stopped again when the
# application shuts down.
spring.docker.compose.enabled=true
spring.docker.compose.file=compose-dev.yaml

# Swagger UI for manual testing (disabled by default outside dev); spec-first:
# the UI serves the contract itself
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.url=/openapi/recipe-api.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# manual-testing conveniences: full SQL + health details
spring.jpa.show-sql=true
management.endpoint.health.show-details=always
