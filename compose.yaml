services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    environment:
      # This flag prevents the Java 21 SIGILL crash on Apple Silicon
      JAVA_TOOL_OPTIONS: "-XX:UseSVE=0"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 5s
      timeout: 10s
      retries: 20

  # web UI to inspect the recipe-events topic
  redpanda:
    image: docker.redpanda.com/redpandadata/console:v3.9.0
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy

  recipe-service:
    build: .
    image: recipe-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/recipes
      DB_USERNAME: recipes
      DB_PASSWORD: recipes
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # local demo stack: expose Swagger UI (disabled by default in the image)
      SPRINGDOC_APIDOCS_ENABLED: "true"
      SPRINGDOC_SWAGGERUI_ENABLED: "true"
      SPRINGDOC_SWAGGERUI_URL: /openapi/recipe-api.yaml
      SPRINGDOC_SWAGGERUI_PATH: /swagger-ui.html
    ports:
      - "8080:8080"
